<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142b4b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Şube Danışmanım"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>ŞUBE DANIŞMANIM</title><style>
:root{font-family:Inter,system-ui,-apple-system,Arial,sans-serif;color:#142b4b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:960px;margin:auto;padding:22px 16px 60px}header{display:flex;align-items:center;gap:13px;margin-bottom:24px}.logo{width:54px;height:54px;background:#142b4b;border-radius:16px;display:grid;place-items:center;color:white;font-size:28px}h1{font-size:23px;margin:0}small,.muted{color:#69798e}h2{font-size:18px;margin:0 0 16px}.card{background:#fff;border:1px solid #e0e6ee;border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 4px 18px #142b4b08}.hero{background:#142b4b;color:white}.hero small{color:#b5c5d8}.next{font-size:34px;font-weight:800;margin:12px 0 18px}.btn{border:0;border-radius:11px;background:#2671dc;color:#fff;padding:13px 18px;font-weight:700;cursor:pointer;font-size:15px}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.secondary{background:#eaf0f8;color:#142b4b}.btn.danger{background:#fff0f0;color:#ac3030}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:16px;background:#f5f8fc;border-radius:12px}.stat strong{display:block;font-size:24px}.person{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e8edf4;padding:13px 0;gap:8px}.person:last-child{border:0}.person.active{background:#f1f7ff;border-radius:10px;padding:13px}.tag{background:#d9eafe;color:#1855a4;border-radius:30px;padding:5px 9px;font-size:12px;font-weight:700}input{border:1px solid #d4dfea;border-radius:10px;padding:12px;font:inherit;min-width:0;flex:1}form{display:flex;gap:9px;margin-top:14px}.history{list-style:none;margin:0;padding:0}.history li{padding:12px 0;border-bottom:1px solid #edf1f5;display:flex;justify-content:space-between;gap:12px}.history li:last-child{border:0}.foot{font-size:12px;text-align:center;color:#748296;margin-top:20px}@media(max-width:560px){.grid{grid-template-columns:1fr 1fr}.card{padding:17px}.next{font-size:29px}.wrap{padding:16px 12px 45px}h1{font-size:19px}} </style></head><body><main class="wrap"><header><div class="logo">↻</div><div><h1>ŞUBE DANIŞMANIM</h1><small>Müşteri yönlendirme ve sıra takibi</small></div></header><section class="card hero"><small>SIRADAKİ TEMSİLCİ</small><div class="next" id="next">—</div><button class="btn" id="assign">+ Yeni Müşteri Yönlendir</button></section><section class="grid" style="margin-bottom:16px"><div class="stat"><small>Bugünkü müşteri</small><strong id="total">0</strong></div><div class="stat"><small>Temsilci</small><strong id="count">0</strong></div><div class="stat"><small>Son işlem</small><strong id="last" style="font-size:15px;margin-top:7px">—</strong></div></section><section class="card"><h2>Temsilciler ve sıra</h2><div id="people"></div><form id="add"><input id="name" maxlength="60" placeholder="Temsilci adı" required aria-label="Temsilci adı"><button class="btn" type="submit">Ekle</button></form></section><section class="card"><div class="row"><h2 style="margin:0">Bugünkü yönlendirmeler</h2><button class="btn secondary" id="reset">Günü sıfırla</button></div><ul class="history" id="history"></ul></section><p class="foot">v1.0 · Veriler bu cihazda saklanır. Çoklu cihaz senkronizasyonu henüz yoktur.</p></main><script>
const KEY='sube-danismanim-v1';const today=()=>new Date().toLocaleDateString('en-CA');let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.people))state={people:[],nextId:1,nextIndex:0,history:[],day:today()};function normalize(){if(state.day!==today()){state.day=today();state.history=[]}if(!Array.isArray(state.history))state.history=[];if(!Number.isInteger(state.nextIndex))state.nextIndex=0;if(!Number.isInteger(state.nextId))state.nextId=1;if(state.people.length)state.nextIndex=((state.nextIndex%state.people.length)+state.people.length)%state.people.length;else state.nextIndex=0}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}function render(){normalize();save();const p=state.people;document.getElementById('next').textContent=p.length?p[state.nextIndex].name:'Önce temsilci ekleyin';document.getElementById('assign').disabled=!p.length;document.getElementById('total').textContent=state.history.length;document.getElementById('count').textContent=p.length;document.getElementById('last').textContent=state.history.length?new Date(state.history[0].time).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):'—';const box=document.getElementById('people');box.replaceChildren();if(!p.length)box.append(el('p','muted','Henüz temsilci eklenmedi.'));p.forEach((person,i)=>{const r=el('div','person'+(i===state.nextIndex?' active':''));const left=el('div');const label=el('strong','',`${i+1}. ${person.name}`);left.append(label);const n=state.history.filter(h=>h.personId===person.id).length;left.append(el('div','muted',`${n} müşteri yönlendirildi`));r.append(left);const right=el('div','row');if(i===state.nextIndex)right.append(el('span','tag','Sıradaki'));const remove=el('button','btn danger','Sil');remove.type='button';remove.setAttribute('aria-label',`${person.name} temsilcisini sil`);remove.onclick=()=>{if(!confirm(`${person.name} temsilcisini listeden silmek istiyor musunuz?`))return;const nextPerson=p[state.nextIndex]?.id;state.people=state.people.filter(x=>x.id!==person.id);const idx=state.people.findIndex(x=>x.id===nextPerson);state.nextIndex=idx>=0?idx:Math.min(i,state.people.length-1);render()};right.append(remove);r.append(right);box.append(r)});const list=document.getElementById('history');list.replaceChildren();if(!state.history.length)list.append(el('li','muted','Henüz müşteri yönlendirilmedi.'));state.history.forEach((h,i)=>{const li=el('li');li.append(el('span','',`${state.history.length-i}. müşteri → ${h.name}`));li.append(el('small','',new Date(h.time).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})));list.append(li)})}document.getElementById('add').onsubmit=e=>{e.preventDefault();const input=document.getElementById('name');const name=input.value.trim();if(!name)return;if(state.people.some(p=>p.name.toLocaleLowerCase('tr')===name.toLocaleLowerCase('tr'))){alert('Bu isimde temsilci zaten mevcut.');return}state.people.push({id:state.nextId++,name});input.value='';render()};document.getElementById('assign').onclick=()=>{normalize();if(!state.people.length)return;const person=state.people[state.nextIndex];state.history.unshift({personId:person.id,name:person.name,time:new Date().toISOString()});state.nextIndex=(state.nextIndex+1)%state.people.length;render()};document.getElementById('reset').onclick=()=>{if(!confirm('Bugünkü müşteri sayıları ve yönlendirme geçmişi silinsin mi? Temsilciler korunacak.'))return;state.history=[];state.nextIndex=0;state.day=today();render()};render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>

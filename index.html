</div></div></main><script>
const KEY='sube-danismanim-v2';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateLocal=d=>new Date(d).toLocaleString('tr-TR',{dateStyle:'short',timeStyle:'short'});
const monthLocal=d=>{let x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')};
const uid=()=>String(Date.now())+'-'+Math.random().toString(36).slice(2);
let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}
if(!data||!Array.isArray(data.reps)||!Array.isArray(data.records)){
 let old;try{old=JSON.parse(localStorage.getItem('sube-danismanim-v1'))}catch{}
 data={reps:(old?.people||[]).map(p=>({id:String(p.id),name:p.name})),records:[],cursor:Math.max(0,old?.cursor||0)};
}
data.unavailability=Array.isArray(data.unavailability)?data.unavailability:[];data.availability={};
/* v2.6 migration: preserve all historical records, start fixed rotation at previous next rep. */
if(!data.rotation||!Array.isArray(data.rotation.order)){
 const oldOrder=Array.isArray(data.queue)&&data.queue.length?data.queue:data.reps.map(r=>r.id);
 const first=oldOrder[0];
 data.rotation={order:data.reps.map(r=>r.id),cursor:Math.max(0,data.reps.findIndex(r=>r.id===first)),pending:[],round:1};
}
const trNameCompare=(a,b)=>String(a||'').localeCompare(String(b||''),'tr-TR',{sensitivity:'variant'});
const orderedReps=()=>[...data.reps].sort((a,b)=>trNameCompare(a.name,b.name));
function sync(){
 let rot=data.rotation, ids=data.reps.map(r=>r.id);
 rot.round=Math.max(1,Number(rot.round)||1);
 // Sıra numarası korunur; alfabetik listeye yeni kişi dahil edilir.
 rot.order=orderedReps().map(r=>r.id);
 rot.pending=rot.pending.filter((id,i)=>ids.includes(id)&&rot.pending.indexOf(id)===i);
 rot.cursor=rot.order.length?((rot.cursor%rot.order.length)+rot.order.length)%rot.order.length:0;
}
// v4.6: v4.5'te yeni kişi eklendiğinde cursor yanlışlıkla eski kişiye
// bağlanmışsa, son normal müşteri yönlendirmesinin ardından gelen sabit sıraya dön.
// Sadece eski kayıt anındaki sıra yeni yöneticiyi içermiyorsa uygulanır.
const CURSOR_FIX_KEY='sube-danismanim-v4-6-cursor-fixed';
if(!localStorage.getItem(CURSOR_FIX_KEY)){
 const last=data.records[data.records.length-1];
 const oldOrder=last?.rotationBefore?.order;
 const newOrder=orderedReps().map(r=>r.id);
 if(last&&Array.isArray(oldOrder)&&oldOrder.length&&newOrder.length>oldOrder.length
    &&oldOrder.includes(last.repId)&&newOrder.includes(last.repId)
    &&newOrder.some(id=>!oldOrder.includes(id))
    &&Array.isArray(data.rotation.pending)&&data.rotation.pending.length===0){
   const expected=(newOrder.indexOf(last.repId)+1)%newOrder.length;
   const current=data.rotation.cursor;
   if(current!==expected){
     data.rotation.cursor=expected;
     localStorage.setItem(KEY,JSON.stringify(data));
   }
 }
 localStorage.setItem(CURSOR_FIX_KEY,'1');
}
sync();
let selected=null, draftSkips=[], pendingAction=null, editing=null;
$('month').value=monthLocal(Date.now());
function snapshot(){return {order:[...data.rotation.order],cursor:data.rotation.cursor,pending:[...data.rotation.pending],round:data.rotation.round,availability:{...data.availability}}}
function restore(st){data.rotation={order:[...st.order],cursor:st.cursor,pending:[...st.pending],round:st.round};if(st.availability)data.availability={...st.availability};sync()}
function rep(id){return data.reps.find(r=>r.id===id)}
function isAvailable(id){return true}
function candidate(skips=draftSkips){
 sync();const excluded=new Set(skips.map(x=>x.repId));
 for(const id of data.rotation.pending)if(!excluded.has(id))return {id,credit:true,passed:[]};
 return normalCandidate(excluded);
}
function normalCandidate(excluded=new Set()){
 sync();
 const rot=data.rotation,n=rot.order.length;
 if(!n)return null;
 for(let k=0;k<n;k++){
  const index=(rot.cursor+k)%n,id=rot.order[index];
  const roundAtIndex=rot.round+(rot.cursor+k>=n?1:0);
  const person=rep(id);
  if(!person||rot.pending.includes(id)||excluded.has(id))continue;
  if((Number(person.joinRound)||1)>roundAtIndex)continue;
  return {id,credit:false,passed:[],roundAtIndex};
 }
 return null;
}
function askCredit(id){
 return new Promise(resolve=>{
  const modal=$('creditDialog');
  $('creditQuestion').textContent=(rep(id)?.name||'Portföy yöneticisi')+' portföy yöneticisinin bekleyen telafi hakkı var. Şu anda müsait mi?';
  modal.classList.remove('hidden');modal.style.display='flex';
  const finish=result=>{modal.style.display='none';modal.classList.add('hidden');$('creditYes').onclick=null;$('creditNo').onclick=null;$('creditCancel').onclick=null;resolve(result)};
  $('creditYes').onclick=()=>finish('yes');
  $('creditNo').onclick=()=>finish('no');
  $('creditCancel').onclick=()=>finish('cancel');
 });
}
async function chooseForCustomer(extraExcluded=[]){
 const excluded=new Set([...draftSkips.map(x=>x.repId),...extraExcluded]);
 for(let id of [...data.rotation.pending]){
  if(excluded.has(id))continue;

function wrapCanvasText(ctx,value,maxWidth){
 const lines=[];
 const paragraphs=String(value||'').split(/\n/);
 for(const para of paragraphs){
  const words=para.split(/\s+/).filter(Boolean);
  if(!words.length){lines.push('');continue}
  let line='';
  for(const word of words){
   const candidate=line?line+' '+word:word;
   if(ctx.measureText(candidate).width<=maxWidth){line=candidate;continue}
   if(line){lines.push(line);line=''}
   if(ctx.measureText(word).width<=maxWidth){line=word;continue}
   let segment='';
   for(const ch of word){
    if(segment&&ctx.measureText(segment+ch).width>maxWidth){lines.push(segment);segment=ch}
    else segment+=ch;
   }
   line=segment;
  }
  if(line)lines.push(line);
 }
 return lines.length?lines:[''];
}
function makePerformanceCanvas(){

 });

 for(const col of columns){

  const lineH=22, start=titleHeight+(headerHeight-col.label.length*lineH)/2+lineH/2;

   ctx.fillStyle=isTotal?'#f2f2f2':ci===0?'#c3c3c3':ri%2===0?'#fff':'#f5f5f5';

  });

 });

}

$('confirmReason').onclick=async ()=>{
 if(!pendingAction)return;
 let reason=$('reasonSelect').value;
 if(!['Sahada','İzinli','Raporlu','Görüşmede'].includes(reason)){alert('Lütfen sebep seçin.');return}
 if(pendingAction.type==='skip'){
  draftSkips.push({repId:pendingAction.id,reason});pendingAction=null;dialog(false);render();return;
 }
 let last=data.records[data.records.length-1],oldId=pendingAction.id;
 if(!last||last.id!==pendingAction.recordId){alert('Son kayıt değişti.');pendingAction=null;dialog(false);return}
 // Son kaydı geri sarıp, aynı müşteri için tüm atlamaları yeniden uygula.
 let current=snapshot(),oldAvailability={...data.availability};
 if(last.rotationBefore)restore(last.rotationBefore);
 else{data.rotation.cursor=Math.max(0,data.rotation.order.indexOf(oldId));data.rotation.pending=data.rotation.pending.filter(id=>id!==oldId)}
 // Sonradan yapılan müsaitlik değişikliklerini kaybetme.
 
 let original=Array.isArray(last.skipped)?last.skipped:[];
 for(let x of original){if(!data.rotation.pending.includes(x.repId))data.rotation.pending.push(x.repId);}
 if(!data.rotation.pending.includes(oldId))data.rotation.pending.push(oldId);
 
 let next=await chooseForCustomer([...original.map(x=>x.repId),oldId]);
 if(next?.cancelled){restore(current);data.availability=oldAvailability;pendingAction=null;dialog(false);return}
 if(!next){restore(current);data.availability=oldAvailability;alert('Aktarılabilecek portföy yöneticisi bulunamadı.');pendingAction=null;dialog(false);return}
 let target=rep(next.id);
 if(!target){restore(current);data.availability=oldAvailability;alert('Hedef portföy yöneticisi bulunamadı.');return}
 // Eski kayıtları koruyup yalnızca yeni atlamayı geçmişe ekle.
 let before=last.rotationBefore||snapshot();
 data.unavailability.push({id:uid(),repId:oldId,repName:rep(oldId)?.name||last.repName,reason,action:'edit',at:new Date().toISOString(),customerId:last.id});
 last.previousRepName=last.repName;last.repId=target.id;last.repName=target.name;last.correctedAt=new Date().toISOString();last.skipped=[...original,{repId:oldId,reason}];last.rotationBefore=before;
 applyAssignment(next,last.id);
 pendingAction=null;dialog(false);save();alert('Müşteri '+target.name+' portföy yöneticisisine aktarıldı. Atlanan portföy yöneticileriin hakları korundu.')
};
$('resetRound').onclick=async()=>{
 sync();
 if(!data.rotation.order.length){await actionModal({title:'Tur başlatılamadı',message:'Önce bir portföy yöneticisi ekleyin.'});return}
 const previousRound=data.rotation.round;
 const nextRound=previousRound+1;
 const nextName=rep(data.rotation.order[0])?.name||'—';
 const ok=await actionModal({title:'Tur sıfırlansın mı?',message:'Mevcut '+previousRound+'. tur sonlandırılacak ve '+nextRound+'. tur '+nextName+' ile başlayacak. Müşteri kayıtları, portföy yöneticileri ve bekleyen telafi hakları korunacak.',kind:'warning',confirmText:'Yeni turu başlat',cancelText:'Vazgeç'});
 if(!ok)return;
 // Sıra yeniden alfabetik listenin başından başlar; geçmiş ve telafiler değişmez.
 data.rotation.round=nextRound;
 data.rotation.cursor=0;
 draftSkips=[];
 save();
 await actionModal({title:'Yeni tur başladı',message:nextRound+'. tur başlatıldı. Müşteri kayıtları ve bekleyen telafi hakları korundu.'});
};
$('resetAll').onclick=()=>{
 if(!confirm('DİKKAT: Tüm portföy yöneticileri, müşteriler, geçmiş ve sıra hakları bu cihazdan silinecek. Devam edilsin mi?'))return;
 let answer=prompt('Kalıcı sıfırlamayı onaylamak için SIFIRLA yazın:');
 if(answer!=='SIFIRLA'){alert('Sıfırlama iptal edildi.');return}
 localStorage.removeItem(KEY);localStorage.removeItem('sube-danismanim-v1');localStorage.removeItem(PERFORMANCE_KEY);performanceData={};
 data={reps:[],records:[],unavailability:[],availability:{},rotation:{order:[],cursor:0,pending:[],round:1}};
 draftSkips=[];selected=null;localStorage.setItem(KEY,JSON.stringify(data));localStorage.removeItem(UNDO_KEY);render();alert('Test verileri sıfırlandı.')
};
$('month').onchange=render;$('export').onclick=()=>{let m=$('month').value,rows=data.records.filter(x=>monthLocal(x.at)===m);let csv='\uFEFFTarih;Saat;Portföy yöneticisi;Ad;Soyad;Telefon\r\n'+rows.map(x=>[new Date(x.at).toLocaleDateString('tr-TR'),new Date(x.at).toLocaleTimeString('tr-TR'),x.repName,x.first,x.last,x.phone].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='SUBE_DANISMANIM_'+m+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};$('print').onclick=async()=>{
 const month=$('month').value, rows=data.records.filter(x=>monthLocal(x.at)===month);
 const reps=orderedReps();
 reps.sort((a,b)=>trNameCompare(a.name,b.name));
 const width=1200,pad=70, rowH=62, headerH=140, height=headerH+(reps.length+1)*rowH+105;
 const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
 const ctx=canvas.getContext('2d');if(!ctx){alert('Bu cihazda JPEG oluşturulamıyor.');return}
 ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);
 ctx.fillStyle='#142d50';ctx.font='bold 32px system-ui, sans-serif';ctx.fillText('Dönem: '+month.split('-').reverse().join('/'),pad,58);
 ctx.font='23px system-ui, sans-serif';ctx.fillText('Toplam müşteri: '+rows.length,pad,100);
 const top=140;ctx.fillStyle='#e9eff7';ctx.fillRect(pad,top,width-2*pad,60);
 ctx.fillStyle='#243c5a';ctx.font='bold 23px system-ui, sans-serif';ctx.fillText('PORTFÖY YÖNETİCİSİ',pad+20,top+39);ctx.textAlign='right';ctx.fillText('MÜŞTERİ SAYISI',width-pad-20,top+39);ctx.textAlign='left';
 const next=normalCandidate();
 reps.forEach((r,i)=>{
  const y=top+60+i*rowH;ctx.fillStyle=i%2?'#f4f7fb':'#ffffff';ctx.fillRect(pad,y,width-2*pad,rowH);
  const isNext=Boolean(next&&r.id===next.id);
  const hasCompensation=data.rotation.pending.includes(r.id);
  ctx.fillStyle=isNext?'#c62828':'#1b2c43';
  ctx.font=(isNext||hasCompensation?'bold ':'')+'22px system-ui, sans-serif';
  let label=r.name+(isNext?' (SIRADAKİ)':'')+(hasCompensation?' (TELAFİ)':'');
  while(ctx.measureText(label).width>720&&label.length>5)label=label.slice(0,-2)+'…';
  ctx.fillText(label,pad+20,y+40);ctx.textAlign='right';ctx.fillText(String(rows.filter(x=>x.repId===r.id).length),width-pad-20,y+40);ctx.textAlign='left';
 });
 const ty=top+60+reps.length*rowH;ctx.fillStyle='#e9eff7';ctx.fillRect(pad,ty,width-2*pad,rowH);
 ctx.fillStyle='#142d50';ctx.font='bold 24px system-ui, sans-serif';ctx.fillText('ŞUBE TOPLAMI',pad+20,ty+41);ctx.textAlign='right';ctx.fillText(String(rows.length),width-pad-20,ty+41);ctx.textAlign='left';
 ctx.fillStyle='#7b8999';ctx.font='18px system-ui, sans-serif';ctx.fillText('Oluşturulma: '+new Date().toLocaleString('tr-TR'),pad,height-35);
 const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.94));
 if(!blob){alert('JPEG oluşturulamadı.');return}
 const filename='SUBE_DANISMANIM_RAPOR_'+month+'.jpg';
 const file=new File([blob],filename,{type:'image/jpeg'});
 if(navigator.canShare?.({files:[file]})&&navigator.share){try{await navigator.share({files:[file],title:'Güncel Tabela Raporu'});return}catch(e){if(e.name==='AbortError')return}}
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)
};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});

const COLLECTION_KEY='sube-danismanim-collections-v1';
const COLLECTION_MANAGERS_KEY='sube-danismanim-collection-managers-v1';
let collectionManagers=[];
try{const saved=JSON.parse(localStorage.getItem(COLLECTION_MANAGERS_KEY));if(Array.isArray(saved))collectionManagers=saved}catch(e){}
function saveCollectionManagers(){localStorage.setItem(COLLECTION_MANAGERS_KEY,JSON.stringify(collectionManagers))}
let collectionData=[];
try{const stored=JSON.parse(localStorage.getItem(COLLECTION_KEY));if(Array.isArray(stored))collectionData=stored}catch(e){}
const collectionOpenReps=new Set(),collectionOpenCustomers=new Set(),collectionEditing=new Set();
const collectionRates={'Çekilişli':85,'Müşteri Bazlı':70,'Hemen Teslim':90};
function collectionToday(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function collectionStatus(item){
 const financed=BigInt(onlyDigits(item.finance||'')||'0');
 const received=BigInt(onlyDigits(item.received||'')||'0');
 const rate=collectionRates[item.project]||0;
 if(financed>0n&&rate>0&&received*1000n>=financed*BigInt(rate))return 'full';
 if(received>0n)return 'partial';
 return 'none';
}
function collectionStatusLabel(status){return status==='full'?'TAM':status==='partial'?'KISMİ':'TAHSİLAT YOK'}
function collectionStore(){localStorage.setItem(COLLECTION_KEY,JSON.stringify(collectionData))}
function collectionField(id,key,label,type,value){
 const attr='data-collection-field="'+key+'"';
 if(type==='project')return '<div class="collection-field"><label for="'+id+'-'+key+'">'+label+'</label><select id="'+id+'-'+key+'" '+attr+'>'+['Çekilişli','Müşteri Bazlı','Hemen Teslim'].map(v=>'<option '+(v===value?'selected':'')+'>'+v+'</option>').join('')+'</select></div>';
 const money=type==='money';
 return '<div class="collection-field"><label for="'+id+'-'+key+'">'+label+'</label><div class="'+(money?'collection-money':'')+'"><input id="'+id+'-'+key+'" '+attr+' type="'+(type==='date'?'date':'text')+'" '+(money?'inputmode="numeric"':'')+' value="'+esc(money?moneyDisplay(value):value||'')+'" '+(key==='name'?'maxlength="120" required':'')+'></div></div>';
}
function collectionFormHtml(item,repId){
 const newRecord=!item, v=item||{name:'',registered:collectionToday(),finance:'',project:'Çekilişli',received:'',receivedDate:''};
 const id='col-'+(item?.id||'new-'+repId).replace(/[^a-zA-Z0-9_-]/g,'');
 return '<form class="collection-entry-form" data-collection-id="'+esc(item?.id||'')+'" data-collection-rep="'+esc(repId)+'"><div class="collection-fields">'+[
 collectionField(id,'name','İsim Soyisim','text',v.name),
 collectionField(id,'registered','Kayıt Tarihi','date',v.registered),
 collectionField(id,'finance','Finansman Tutarı','money',v.finance),
 collectionField(id,'project','Proje Türü','project',v.project),
 collectionField(id,'received','Gerçekleşen Tahsilat','money',v.received),
 collectionField(id,'receivedDate','Tamamlanacak Tahsilat Tarihi','date',v.receivedDate)
 ].join('')+'</div><div class="collection-status-info" data-collection-info></div><div class="collection-form-actions"><button type="submit">'+(newRecord?'Kaydı oluştur':'Değişiklikleri kaydet')+'</button><button type="button" class="secondary" data-collection-cancel>Vazgeç</button></div></form>';
}
function renderCollections(){
 const host=$('collectionRepCards');if(!host)return;
 host.innerHTML=collectionManagers.map(r=>{
  const records=collectionData.filter(x=>x.repId===r.id);
  const isOpen=collectionOpenReps.has(r.id);
  return '<article class="collection-rep"><div class="collection-rep-head"><div class="collection-rep-title"><h3>'+esc(r.name)+'</h3><small>'+records.length+' tahsilat kaydı</small></div><button type="button" class="secondary collection-rep-toggle" data-collection-rep-toggle="'+esc(r.id)+'">'+(isOpen?'Kartı kapat':'Kartı aç')+'</button></div><div class="collection-rep-body" '+(isOpen?'':'hidden')+'><div style="margin:10px 0 16px"><button type="button" data-collection-add="'+esc(r.id)+'">Kayıt Ekle</button></div><div data-collection-new="'+esc(r.id)+'">'+(collectionEditing.has('new-'+r.id)?collectionFormHtml(null,r.id):'')+'</div>'+records.map(item=>{
   const open=collectionOpenCustomers.has(item.id),editing=collectionEditing.has(item.id),status=collectionStatus(item);
   return '<article class="collection-customer"><div class="collection-customer-head"><h4>'+esc(item.name||'İsimsiz müşteri')+'</h4><div class="row" style="gap:8px;align-items:center"><span class="collection-badge '+status+'" data-collection-status="'+esc(item.id)+'">'+collectionStatusLabel(status)+'</span><button type="button" class="secondary" data-collection-customer-toggle="'+esc(item.id)+'">'+(open?'Kartı kapat':'Kartı aç')+'</button></div></div><div class="collection-customer-body" '+(open?'':'hidden')+'>'+(editing?collectionFormHtml(item,r.id):'<div class="collection-fields"><div><strong>Kayıt Tarihi</strong><p>'+esc(item.registered||'—')+'</p></div><div><strong>Finansman Tutarı</strong><p>'+moneyDisplay(item.finance)+' ₺</p></div><div><strong>Proje Türü</strong><p>'+esc(item.project)+'</p></div><div><strong>Gerçekleşen Tahsilat</strong><p>'+moneyDisplay(item.received)+' ₺</p></div><div><strong>Tamamlanacak Tahsilat Tarihi</strong><p>'+esc(item.receivedDate||'—')+'</p></div></div><div style="margin-top:12px"><button type="button" class="secondary" data-collection-edit="'+esc(item.id)+'">Düzenle</button></div>')+'</div></article>';
  }).join('')+'</div></article>';
 }).join('')||'<div class="panel">Tahsilat bölümüne henüz portföy yöneticisi eklenmedi. Yukarıdaki formdan ekleyebilirsiniz.</div>';
 host.querySelectorAll('[data-collection-rep-toggle]').forEach(b=>b.onclick=()=>{const id=b.dataset.collectionRepToggle;if(collectionOpenReps.has(id))collectionOpenReps.delete(id);else collectionOpenReps.add(id);renderCollections()});
 host.querySelectorAll('[data-collection-customer-toggle]').forEach(b=>b.onclick=()=>{const id=b.dataset.collectionCustomerToggle;if(collectionOpenCustomers.has(id))collectionOpenCustomers.delete(id);else collectionOpenCustomers.add(id);renderCollections()});
 host.querySelectorAll('[data-collection-add]').forEach(b=>b.onclick=()=>{collectionEditing.add('new-'+b.dataset.collectionAdd);renderCollections()});
 host.querySelectorAll('[data-collection-edit]').forEach(b=>b.onclick=()=>{collectionEditing.add(b.dataset.collectionEdit);renderCollections()});
 host.querySelectorAll('.collection-entry-form').forEach(form=>{
  const id=form.dataset.collectionId,repId=form.dataset.collectionRep;
  const fields=Object.fromEntries([...form.querySelectorAll('[data-collection-field]')].map(i=>[i.dataset.collectionField,i]));
  const updateInfo=()=>{
   const status=collectionStatus({finance:fields.finance.value,received:fields.received.value,project:fields.project.value});
   const rate=collectionRates[fields.project.value]||0;
   const target=(BigInt(onlyDigits(fields.finance.value)||'0')*BigInt(rate)+999n)/1000n;
   form.querySelector('[data-collection-info]').textContent='Durum: '+collectionStatusLabel(status)+' · TAM için gereken tahsilat: '+moneyDisplay(target.toString())+' ₺';
  };
  for(const key of ['finance','received'])fields[key].addEventListener('input',()=>{
   const el=fields[key],original=el.value,position=el.selectionStart||0;
   const formatted=moneyDisplay(original),newPosition=moneyDisplay(original.slice(0,position)).length;
   if(original!==formatted){el.value=formatted;el.setSelectionRange(newPosition,newPosition)}
   updateInfo();
  });
  fields.project.addEventListener('change',updateInfo);updateInfo();
  form.querySelector('[data-collection-cancel]').onclick=()=>{collectionEditing.delete(id||'new-'+repId);renderCollections()};
  form.onsubmit=e=>{
   e.preventDefault();const name=fields.name.value.trim();if(!name){fields.name.focus();return}
   const record={id:id||uid(),repId,name,registered:fields.registered.value||collectionToday(),finance:onlyDigits(fields.finance.value),project:fields.project.value,received:onlyDigits(fields.received.value),receivedDate:fields.receivedDate.value};
   if(id){const at=collectionData.findIndex(x=>x.id===id);if(at<0)return;collectionData[at]=record}
   else collectionData.push(record);
   try{collectionStore()}catch(err){alert('Tahsilat kaydı kaydedilemedi. Tarayıcı depolama alanını kontrol edin.');return}
   collectionEditing.delete(id||'new-'+repId);collectionOpenCustomers.add(record.id);renderCollections();
  };
 });
}
$('collectionManagerForm').onsubmit=e=>{
 e.preventDefault();
 const input=$('collectionManagerName'),name=input.value.trim();
 if(!name)return;
 collectionManagers.push({id:uid(),name});
 try{saveCollectionManagers()}catch(err){collectionManagers.pop();alert('Portföy yöneticisi kaydedilemedi.');return}
 input.value='';renderCollections();
};
render();
</script></body></html>
